<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael V. Cordoba | AI Workflow Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #38bdf8; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto glass p-10 rounded-3xl">
        <h1 class="text-4xl font-bold mb-2 tracking-tight">Michael V. <span class="gradient-text">Cordoba</span></h1>
        <p class="text-sky-400 font-mono tracking-widest text-sm mb-6 uppercase">AI Workflow Architect & Advisor</p>
        <p class="text-slate-400 leading-relaxed mb-8">
            PhD, MS, and Patent holder with deep roots in semiconductor R&D. Now focused on AI Workflow Integration and Turnaround Forensics.
        </p>
        <div class="border-l-4 border-sky-500 pl-4 py-2 bg-slate-800/50">
            <p class="text-white font-bold italic">"Rise of Men" — Rank #1 Google Search</p>
        </div>
    </div>
</body>
</html>
